# Application
spring.application.name=beans-finder

# Virtual Threads (Java 21+ / Spring Boot 3.2+)
spring.threads.virtual.enabled=true

# Force HTTPS for OAuth2 redirect URIs (when behind reverse proxy)
server.forward-headers-strategy=framework

# Database Configuration (PostgreSQL / Neon)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/coffee_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (optimized for Neon serverless with cold start resilience)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=600000
# REDUCED: 15s connection timeout for faster failure during cold start
# Neon typically wakes in 1-3s, but DNS/network issues should fail fast
# GlobalExceptionHandler returns 503 with retry hint for user-friendly experience
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1800000
# CRITICAL: keepalive-time=0 prevents DNS lookups when Neon scales to zero
# Without this, HikariCP sends keepalive queries every 30s which causes
# UnknownHostException when Neon compute is suspended (3:00-6:00 AM)
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
# Leak detection: 5 minutes (300s) - crawling operations take > 60s due to Playwright + OpenAI calls
spring.datasource.hikari.leak-detection-threshold=300000
# Don't fail on startup if DB unavailable (allows app to start and retry later)
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA / Hibernate Configuration
# ddl-auto=none prevents Hibernate from connecting at startup (Neon cold start fix)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# CRITICAL: Explicitly set dialect so Hibernate doesn't need DB connection at startup
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# CRITICAL: Prevent Hibernate from accessing JDBC metadata during bootstrap
# This allows app to start even when Neon DNS is unavailable (cold state)
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Defer JPA initialization to prevent startup failure when DB is cold
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Neo4j Configuration
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password}
spring.neo4j.pool.max-connection-pool-size=50
spring.neo4j.pool.connection-acquisition-timeout=60s
spring.neo4j.pool.max-connection-lifetime=1h

# API Configuration
# Perplexity: For web search, URL filtering, brand discovery
perplexity.api.key=${PERPLEXITY_API_KEY:}
perplexity.api.url=https://api.perplexity.ai/chat/completions
perplexity.api.model=sonar-pro

# OpenAI: For text extraction from Playwright-rendered content (20x cheaper than Perplexity)
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini
openai.temperature=0.1
openai.max.tokens=1000

# Grok: For RAG-powered chatbot with Neo4j knowledge graph
grok.api.key=${GROK_API_KEY:}
grok.api.url=https://api.x.ai/v1/chat/completions
grok.model=grok-4-fast-reasoning
grok.temperature=0.3
grok.max.tokens=1500

# Redis Configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=86400000
spring.cache.redis.cache-null-values=false

# Chatbot Configuration
chatbot.max.context.products=15
chatbot.conversation.ttl.minutes=60

# Rate Limiting Configuration (configurable via env vars)
chatbot.ratelimit.per.minute=${CHATBOT_RATE_LIMIT_PER_MINUTE:5}
chatbot.ratelimit.per.day=${CHATBOT_RATE_LIMIT_PER_DAY:100}

# Cost Control Configuration (configurable via env vars)
chatbot.cost.daily.limit=${CHATBOT_COST_DAILY_LIMIT:1.00}

# Input Validation
chatbot.query.max.length=500

# Semantic Cache Configuration (LangCache)
chatbot.semantic.cache.enabled=true
chatbot.semantic.cache.similarity.threshold=0.88
chatbot.semantic.cache.ttl.hours=1

# Crawler Configuration
crawler.delay.seconds=2
crawler.retry.attempts=3
crawler.update.interval.days=14
crawler.user.agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
crawler.playwright.chunk.size=10

# Crawl4AI Microservice
crawl.service.url=${CRAWL_SERVICE_URL:http://localhost:8081}
crawl.service.enabled=${CRAWL_SERVICE_ENABLED:true}
crawl.service.timeout-ms=30000

# Scheduling & Async (prevent thread starvation)
spring.task.scheduling.pool.size=4
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# Resilience4j Circuit Breaker (for Neon serverless cold start)
resilience4j.circuitbreaker.instances.database.sliding-window-size=5
resilience4j.circuitbreaker.instances.database.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.database.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.database.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.database.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.database.slow-call-rate-threshold=50

# Resilience4j Retry (for transient connection failures)
# Reduced: 2 attempts with 2s wait = max 4s retry overhead
# Combined with 15s connection-timeout = ~20s worst case before 503 response
resilience4j.retry.instances.database.max-attempts=2
resilience4j.retry.instances.database.wait-duration=2s
resilience4j.retry.instances.database.enable-exponential-backoff=false

# Actuator endpoints for health monitoring
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Logging
logging.level.com.coffee=INFO
logging.level.org.springframework.data.neo4j=INFO
# Suppress Neo4j deprecation warnings (known issue with Spring Data Neo4j auto-generated queries)
logging.level.org.springframework.data.neo4j.cypher.deprecation=ERROR
logging.level.org.springframework.data.neo4j.cypher.unrecognized=ERROR
logging.level.com.coffee.beansfinder.service.NominatimGeolocationService=DEBUG
logging.level.com.coffee.beansfinder.service.OpenAIService=DEBUG

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=https://graphee.link/login/oauth2/code/google

# Instagram Platform API (OAuth - works with Creator accounts)
instagram.app.id=${INSTAGRAM_APP_ID:}
instagram.app.secret=${INSTAGRAM_APP_SECRET:}
instagram.oauth.redirect.uri=${INSTAGRAM_OAUTH_REDIRECT_URI:https://graphee.link/api/instagram/oauth/callback}
# Direct credentials (fallback if OAuth not used)
instagram.user.id=${INSTAGRAM_USER_ID:}
instagram.access.token=${INSTAGRAM_ACCESS_TOKEN:}
instagram.publisher.check.interval=900000

# Reddit Crawler (public JSON, no API key needed)
instagram.reddit.subreddits=pourover,Coffee,espresso

# Image Generation Provider: "dalle" or "gemini"
instagram.image.provider=${IMAGE_PROVIDER:dalle}

# DALL-E Image Generation (uses existing openai.api.key)
dalle.model=dall-e-3
dalle.size=1024x1024
dalle.quality=standard
# Store images outside JAR (external directory)
dalle.image.storage.path=${DALLE_IMAGE_PATH:./instagram-images}
dalle.image.base.url=${DALLE_IMAGE_URL:/instagram-images}

# Gemini Image Generation (alternative to DALL-E)
# Models: gemini-2.0-flash-exp (experimental), gemini-2.5-flash-image (stable, aka Nano Banana)
gemini.api.key=${GEMINI_API_KEY:}
gemini.image.model=${GEMINI_IMAGE_MODEL:gemini-2.0-flash-exp}
gemini.image.storage.path=${GEMINI_IMAGE_PATH:./instagram-images}
gemini.image.base.url=${GEMINI_IMAGE_URL:/instagram-images}

# Multipart file upload limits (for image uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Image Upload for Instagram (when running locally with Gemini)
# Local calls production API to upload image, returns public URL
image.upload.enabled=${IMAGE_UPLOAD_ENABLED:false}
image.upload.api.url=${IMAGE_UPLOAD_API_URL:https://graphee.link/api/images/upload-base64}
image.upload.api.key=${IMAGE_UPLOAD_API_KEY:}
image.upload.storage.path=${IMAGE_UPLOAD_STORAGE_PATH:./instagram-images}

# Serve static files from external directory
spring.web.resources.static-locations=classpath:/static/,file:./instagram-images/