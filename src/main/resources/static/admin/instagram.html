<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Admin - Graphee.link</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/png" href="/graphee_logo.png">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            margin: 0;
            color: #005F73;
        }

        .admin-actions {
            display: flex;
            gap: 1rem;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e9ecef;
        }

        .tab-btn {
            padding: 1rem 2rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: #005F73;
        }

        .tab-btn.active {
            color: #005F73;
            border-bottom-color: #005F73;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .post-card {
            display: flex;
            gap: 1.5rem;
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .post-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .post-image-placeholder {
            width: 200px;
            height: 200px;
            background: #f0f0f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            flex-shrink: 0;
        }

        .post-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .post-caption {
            flex: 1;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
        }

        .post-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #666;
        }

        .post-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 120px;
        }

        .status-badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-draft { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }
        .status-scheduled { background: #cce5ff; color: #004085; }
        .status-posted { background: #d4edda; color: #155724; }
        .status-rejected { background: #f8d7da; color: #721c24; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #e9ecef;
        }

        .modal-header h2 {
            margin: 0;
            color: #005F73;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-body .review-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .review-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
        }

        .caption-textarea {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
        }

        .caption-textarea:focus {
            outline: none;
            border-color: #005F73;
        }

        .schedule-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }

        .schedule-input {
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-right: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 0.5rem;
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            background: #f8f9fa;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #005F73;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #666;
        }

        .loading {
            display: flex;
            justify-content: center;
            padding: 3rem;
        }

        .loading::after {
            content: '';
            width: 40px;
            height: 40px;
            border: 4px solid #e9ecef;
            border-top-color: #005F73;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/" class="logo-link">
                    <img src="/graphee_logo.png" alt="Graphee.link" class="nav-logo">
                    <span class="brand-name">Graphee.link</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/chat.html">Chat</a>
                <a href="/brands.html">Brands</a>
                <a href="/flavor-wheel.html">Flavor Wheel</a>
                <a href="/map.html">Map</a>
                <a href="/admin/instagram.html" class="active">Instagram Admin</a>
            </div>
        </div>
    </nav>

    <main class="admin-container">
        <div class="admin-header">
            <h1>Instagram Content Management</h1>
            <div class="admin-actions">
                <button class="btn btn-secondary" onclick="crawlReddit()">Crawl Reddit</button>
                <button class="btn btn-primary" onclick="generatePost()">Generate Post</button>
            </div>
        </div>

        <div class="stats-bar" id="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="stat-draft">-</div>
                <div class="stat-label">Drafts</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-scheduled">-</div>
                <div class="stat-label">Scheduled</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-posted">-</div>
                <div class="stat-label">Posted</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-reddit">-</div>
                <div class="stat-label">Reddit Posts Cached</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('drafts')">Drafts</button>
            <button class="tab-btn" onclick="showTab('scheduled')">Scheduled</button>
            <button class="tab-btn" onclick="showTab('posted')">Posted</button>
            <button class="tab-btn" onclick="showTab('rejected')">Rejected</button>
        </div>

        <div id="drafts-tab" class="tab-content active">
            <div id="drafts-container" class="loading"></div>
        </div>

        <div id="scheduled-tab" class="tab-content">
            <div id="scheduled-container" class="loading"></div>
        </div>

        <div id="posted-tab" class="tab-content">
            <div id="posted-container" class="loading"></div>
        </div>

        <div id="rejected-tab" class="tab-content">
            <div id="rejected-container" class="loading"></div>
        </div>
    </main>

    <!-- Review Modal -->
    <div id="review-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Review Post</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="review-grid">
                    <div>
                        <img id="modal-image" class="review-image" src="" alt="Post image">
                        <button class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="regenerateImage()">
                            Regenerate Image
                        </button>
                    </div>
                    <div>
                        <label style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Caption</label>
                        <textarea id="modal-caption" class="caption-textarea"></textarea>

                        <div class="schedule-section">
                            <label style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Schedule For</label>
                            <input type="datetime-local" id="modal-schedule" class="schedule-input">
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="rejectPost()" style="background: #dc3545; color: white; border: none;">
                        Reject
                    </button>
                    <button class="btn btn-secondary" onclick="saveCaption()">
                        Save Caption
                    </button>
                    <button class="btn btn-primary" onclick="approveAndSchedule()">
                        Approve & Schedule
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/admin-instagram.js"></script>
</body>
</html>
