<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        h1 { color: #4ade80; }
        .upload-box {
            border: 2px dashed #444;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            margin: 20px 0;
        }
        .upload-box.dragover { border-color: #4ade80; background: #1f2f1f; }
        input[type="file"] { margin: 10px 0; }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        button {
            background: #4ade80;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #22c55e; }
        button:disabled { background: #666; cursor: not-allowed; }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 4px;
            word-break: break-all;
        }
        .result.success { border-left: 4px solid #4ade80; }
        .result.error { border-left: 4px solid #ef4444; }
        .url-box {
            background: #333;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            font-family: monospace;
        }
        .copy-btn {
            background: #666;
            padding: 6px 12px;
            font-size: 12px;
            margin-left: 10px;
        }
        img.preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Upload Image</h1>

    <label>API Key:</label>
    <input type="password" id="apiKey" placeholder="Enter API key">

    <div class="upload-box" id="dropZone">
        <p>Drag & drop image here or</p>
        <input type="file" id="fileInput" accept="image/*">
        <img class="preview" id="preview" style="display:none">
    </div>

    <button id="uploadBtn" disabled>Upload</button>

    <div class="result" id="result" style="display:none"></div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('preview');
        const result = document.getElementById('result');
        const apiKeyInput = document.getElementById('apiKey');

        let selectedFile = null;

        // Load saved API key
        apiKeyInput.value = localStorage.getItem('uploadApiKey') || '';

        // Drag & drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                handleFile(fileInput.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }
            selectedFile = file;
            uploadBtn.disabled = false;

            // Preview
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const apiKey = apiKeyInput.value;
            localStorage.setItem('uploadApiKey', apiKey);

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            result.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('file', selectedFile);

                const response = await fetch('/api/images/upload', {
                    method: 'POST',
                    headers: apiKey ? { 'X-API-Key': apiKey } : {},
                    body: formData
                });

                const text = await response.text();
                console.log('Response status:', response.status);
                console.log('Response text:', text);

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    result.className = 'result error';
                    result.innerHTML = `<strong>Error ${response.status}:</strong><pre>${text.substring(0, 500)}</pre>`;
                    result.style.display = 'block';
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'Upload';
                    return;
                }

                if (response.ok && data.url) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>Uploaded!</strong>
                        <div class="url-box">
                            ${data.url}
                            <button class="copy-btn" onclick="copyUrl('${data.url}')">Copy</button>
                        </div>
                    `;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `<strong>Error ${response.status}:</strong> ${data.error || JSON.stringify(data)}`;
                }
            } catch (err) {
                result.className = 'result error';
                result.innerHTML = `<strong>Error:</strong> ${err.message}`;
            }

            result.style.display = 'block';
            uploadBtn.disabled = false;
            uploadBtn.textContent = 'Upload';
        });

        function copyUrl(url) {
            navigator.clipboard.writeText(url);
            alert('Copied!');
        }
    </script>
</body>
</html>
